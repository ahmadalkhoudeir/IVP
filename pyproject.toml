[project]
name = "ivp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ivp = "ivp:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "SIM"]
# DTZ (flake8-datetimez) is intentional, not noise: audit-log timestamps must
# always be timezone-aware so records are unambiguous and legally
# defensible. Fix the call site (use datetime.now(UTC) / tzinfo=UTC), don't
# suppress this rule.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls Depends()/require_permission()
# etc. in argument defaults by design — that's how the framework knows what
# to inject. B008 exists to catch accidental mutable-default bugs, not this.
extend-immutable-calls = [
    "fastapi.Depends",
    "ivp.auth.deps.require_permission",
    "ivp.auth.deps.require_role",
    "ivp.web.routes_admin._require",
]
